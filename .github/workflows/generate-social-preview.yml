name: Generate social preview

on:
  push:
    branches: [main]
    paths:
      - 'social-preview.svg'
      - '.github/workflows/generate-social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Open Graph PNG
        run: |
          rsvg-convert -w 1200 -h 627 social-preview.svg -o linkedin-preview-20260923.png
          rsvg-convert -w 2400 -h 1254 social-preview.svg -o social-preview-v3.png
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-preview-20260923.png social-preview-v3.png
          git diff --cached --quiet || git commit -m "Generate crisp social preview images"
          git push
