name: Generate social preview

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-og.py"
      - ".github/workflows/generate-social-preview.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/generate-og.py
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          git diff --cached --quiet || git commit -m "Generate social preview image"
          git push
