name: Homepage desktop and mobile interaction checks
on:
  push:
    branches:
      - feature/homepage-studio-20261016
      - main
    paths:
      - index.html
      - script.js
      - styles.css
      - tests/homepage.mjs
      - .github/workflows/homepage-ui-checks.yml
  pull_request:
    paths:
      - index.html
      - script.js
      - styles.css
      - tests/homepage.mjs
      - .github/workflows/homepage-ui-checks.yml
  workflow_dispatch:
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hc-server.log 2>&1 &
          sleep 2
      - name: Check desktop, tablet and mobile functionality
        run: node tests/homepage.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-desktop-mobile-screenshots
          path: ui-artifacts/
          retention-days: 7
      - name: Confirm public homepage after main deployment
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://hendrycommercial.co.uk/?build=${GITHUB_SHA}" -o /tmp/hc-live.html; then
              if grep -q '20261016-drag1' /tmp/hc-live.html && grep -q 'studio-stage' /tmp/hc-live.html && ! grep -qi 'Cold Call Cara' /tmp/hc-live.html; then
                curl -fsSL --connect-timeout 10 --max-time 20 'https://hendrycommercial.co.uk/check/' -o /dev/null
                echo 'PASS: live homepage is updated, Cara remains unpublished and Buyer Readiness remains reachable.'
                exit 0
              fi
            fi
            echo "Waiting for deployment propagation (${attempt}/24)..."
            sleep 10
          done
          echo 'FAIL: live homepage not verified within the deployment check window.'
          exit 1
