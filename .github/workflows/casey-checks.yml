name: Casey public preparation checks
on:
  pull_request:
    paths: ['casey/**', 'lib/**', 'functions/casey/**', 'functions/_middleware.js', 'scripts/build-public.mjs', 'tests/casey-api.mjs', '.github/workflows/casey-checks.yml']
  push:
    branches: [main, feature/casey-public-20261102]
    paths: ['casey/**', 'lib/**', 'functions/casey/**', 'functions/_middleware.js', 'scripts/build-public.mjs', 'tests/casey-api.mjs', '.github/workflows/casey-checks.yml']
jobs:
  stateless-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/casey-api.mjs
      - run: node --check casey/casey.js
      - run: node scripts/build-public.mjs
